name: Update README repos

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Rewrite repo pins in README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Fetch up to 10 most-recently-pushed public non-fork repos
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'tyler-macinnis',
              type: 'owner',
              sort: 'pushed',
              direction: 'desc',
              per_page: 10,
            });

            const public_repos = repos
              .filter(r => !r.fork && !r.archived && r.name !== 'tyler-macinnis')
              .slice(0, 6);

            const pins = public_repos.map(r => {
              const encoded = encodeURIComponent(r.name);
              return `[![${r.name}](https://github-readme-stats.vercel.app/api/pin/?username=tyler-macinnis&repo=${encoded}&theme=github_dark&hide_border=true)](${r.html_url})`;
            }).join('\n');

            const block = `<!-- REPOS_START -->\n<div align="center">\n\n${pins}\n\n</div>\n<!-- REPOS_END -->`;

            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- REPOS_START -->[\s\S]*?<!-- REPOS_END -->/,
              block
            );

            if (updated !== readme) {
              fs.writeFileSync('README.md', updated);
              console.log('README updated with latest repos.');
            } else {
              console.log('No changes needed.');
            }

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (
            git add README.md &&
            git commit -m "chore: auto-update pinned repos [skip ci]" &&
            git push
          )
